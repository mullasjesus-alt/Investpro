<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bem-vindo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:radial-gradient(circle at center,#1a2440 0%,#0b1020 70%,#05070f 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    color:#fff;
    position:relative;
}

/* Overlay de transição (entrada e saída) */
.overlay{
    position:fixed;
    inset:0;
    background:#05070f;
    z-index:100;
    opacity:1;
    transition:opacity 0.6s ease;
    pointer-events:none;
}

.overlay.fade-in{
    opacity:0;
}

.overlay.fade-out{
    opacity:1;
}

/* Órbitas */
.orbit{
    position:absolute;
    border-radius:50%;
    border:1px solid rgba(212,175,55,.12);
    animation:spin linear infinite;
}

.orbit.r1{
    width:280px;
    height:280px;
    animation-duration:15s;
}

.orbit.r2{
    width:420px;
    height:420px;
    animation-duration:25s;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

/* Partículas */
.particle{
    position:absolute;
    border-radius:50%;
    background:rgba(212,175,55,.6);
    animation:floatUp linear infinite;
}

@keyframes floatUp{
    0%{transform:translateY(100vh);opacity:0;}
    20%{opacity:1;}
    80%{opacity:1;}
    100%{transform:translateY(-20vh);opacity:0;}
}

/* Logo — começa invisível, entra com slide suave */
.logo-wrap{
    z-index:10;
    text-align:center;
    opacity:0;
    transform:translateY(18px) scale(.95);
    transition:opacity 0.7s ease 0.4s, transform 0.7s ease 0.4s;
}

.logo-wrap.visible{
    opacity:1;
    transform:translateY(0) scale(1);
}

.logo-wrap img{
    width:140px;
    max-width:40vw;
}

/* Texto */
.tagline{
    margin-top:20px;
    font-size:1rem;
    color:rgba(255,255,255,.85);
    padding:0 20px;
    opacity:0;
    transform:translateY(8px);
    transition:opacity 0.6s ease 0.85s, transform 0.6s ease 0.85s;
}

.logo-wrap.visible .tagline{
    opacity:1;
    transform:translateY(0);
}

/* Barra */
.progress-track{
    position:absolute;
    bottom:50px;
    left:50%;
    transform:translateX(-50%);
    width:180px;
    height:4px;
    background:rgba(255,255,255,.1);
    border-radius:20px;
    overflow:hidden;
    opacity:0;
    transition:opacity 0.4s ease 1.1s;
}

.progress-track.visible{
    opacity:1;
}

.progress-fill{
    height:100%;
    width:0;
    background:linear-gradient(90deg,#bfa64f,#ffe08a);
    border-radius:20px;
}

/* Animação da barra controlada por JS */
.progress-fill.run{
    transition:width 2.2s linear;
    width:100%;
}
</style>
</head>
<body>

<!-- Overlay escuro que cobre a tela (entrada e saída) -->
<div class="overlay" id="overlay"></div>

<div class="orbit r1"></div>
<div class="orbit r2"></div>

<div id="particles"></div>

<div class="logo-wrap" id="logoWrap">
    <img src="investpro-logo.png" alt="Logo">
    <div class="tagline">
        Invista com inteligência. Cresça com confiança.
    </div>
</div>

<div class="progress-track" id="progressTrack">
    <div class="progress-fill" id="progressFill"></div>
</div>

<script>
// Partículas
const container = document.getElementById('particles');
for(let i=0;i<5;i++){
    const p=document.createElement('div');
    p.className='particle';
    const size=2+Math.random()*3;
    p.style.width=size+'px';
    p.style.height=size+'px';
    p.style.left=Math.random()*100+'vw';
    p.style.animationDuration=(8+Math.random()*5)+'s';
    p.style.animationDelay=Math.random()*3+'s';
    container.appendChild(p);
}

const overlay      = document.getElementById('overlay');
const logoWrap     = document.getElementById('logoWrap');
const progressTrack= document.getElementById('progressTrack');
const progressFill = document.getElementById('progressFill');

// TOTAL da splash: ~3.2s antes de redirecionar
const TOTAL = 3200;   // ms que o usuário fica na tela
const FADE_OUT = 600; // ms da transição de saída

window.addEventListener('load', () => {

    // 1) Fade-in da tela (remove overlay escuro)
    requestAnimationFrame(() => {
        overlay.classList.add('fade-in');
    });

    // 2) Aparece o logo e tagline (via CSS transition com delay)
    setTimeout(() => logoWrap.classList.add('visible'), 50);

    // 3) Aparece e anima a barra de progresso
    setTimeout(() => {
        progressTrack.classList.add('visible');
        requestAnimationFrame(() => {
            setTimeout(() => progressFill.classList.add('run'), 30);
        });
    }, 50);

    // 4) Fade-out antes de redirecionar
    setTimeout(() => {
        overlay.style.transition = 'opacity '+FADE_OUT+'ms ease';
        overlay.classList.remove('fade-in'); // volta a opacidade 1
    }, TOTAL - FADE_OUT);

    // 5) Redireciona após o fade-out terminar
    setTimeout(() => {
        window.location.replace('login.html');
    }, TOTAL);
});
</script>

</body>
</html>
