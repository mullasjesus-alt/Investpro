<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invest Pro – Suporte</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root{
  --bg:#050505; --s1:#0d0d14; --s2:#13131f; --s3:#1a1a2e;
  --border:rgba(139,92,246,.22);
  --p1:#8B5CF6; --p2:#4F46E5;
  --green:#00ff73; --red:#ff4d4d;
  --text:#e2e2f0; --muted:#666;
}

html,body{ height:100%; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; overflow:hidden; }

.page{ display:flex; flex-direction:column; height:100dvh; max-width:480px; margin:0 auto; background:var(--bg); }

/* HEADER */
.header{
  background:linear-gradient(135deg,#1a0d2e,#110e1f);
  padding:14px 16px; display:flex; align-items:center; gap:12px;
  border-bottom:1px solid var(--border); flex-shrink:0;
  box-shadow:0 4px 24px -8px rgba(139,92,246,.15);
}
.back-btn{ background:none; border:none; color:var(--p1); font-size:20px; cursor:pointer; padding:4px 8px 4px 0; }
.bot-av{
  width:44px; height:44px; border-radius:50%;
  background:linear-gradient(135deg,var(--p1),var(--p2));
  display:flex; align-items:center; justify-content:center;
  font-size:20px; flex-shrink:0; position:relative;
  box-shadow:0 4px 14px -2px rgba(139,92,246,.5);
}
.bot-av .dot{
  position:absolute; bottom:1px; right:1px;
  width:11px; height:11px; background:var(--green);
  border-radius:50%; border:2px solid #110e1f;
  animation:glow 2s infinite;
}
@keyframes glow{ 0%,100%{box-shadow:0 0 0 0 rgba(0,255,115,.4)} 50%{box-shadow:0 0 0 5px rgba(0,255,115,0)} }
.h-info .h-name{ font-size:15px; font-weight:700; letter-spacing:.2px; }
.h-info .h-status{ font-size:11px; color:var(--green); margin-top:2px; display:flex; align-items:center; gap:5px; }

/* TOPICS */
.topics{
  padding:10px 12px; overflow-x:auto;
  display:flex; gap:7px; flex-shrink:0;
  border-bottom:1px solid var(--border);
  scrollbar-width:none;
}
.topics::-webkit-scrollbar{ display:none; }
.chip{
  background:transparent; border:1px solid var(--border);
  color:#a78bfa; border-radius:20px;
  padding:7px 14px; font-size:12px; font-weight:500;
  cursor:pointer; white-space:nowrap; flex-shrink:0;
  transition:all .18s;
}
.chip:hover,.chip:active{ background:rgba(139,92,246,.18); color:#fff; border-color:var(--p1); transform:translateY(-1px); }

/* MESSAGES */
#msgs{
  flex:1; overflow-y:auto;
  padding:14px 13px 8px;
  display:flex; flex-direction:column; gap:4px;
  scroll-behavior:smooth;
}
#msgs::-webkit-scrollbar{ width:3px; }
#msgs::-webkit-scrollbar-thumb{ background:rgba(139,92,246,.2); border-radius:2px; }

.bw{ display:flex; flex-direction:column; margin-bottom:6px; animation:fu .25s ease; }
.bw.user{ align-items:flex-end; }
.bw.bot{ align-items:flex-start; }
@keyframes fu{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)} }

.bubble{
  max-width:82%; padding:10px 14px;
  font-size:14px; line-height:1.55;
  border-radius:18px; word-break:break-word;
}
.bw.bot .bubble{ background:var(--s3); border:1px solid var(--border); border-bottom-left-radius:5px; }
.bw.user .bubble{
  background:linear-gradient(135deg,var(--p1),var(--p2));
  border-bottom-right-radius:5px;
  box-shadow:0 4px 14px -4px rgba(139,92,246,.4);
}
.bubble img, .bubble .file-att{
  display:block; max-width:240px; max-height:240px;
  border-radius:12px; margin:2px 0;
}
.file-att{
  display:flex; align-items:center; gap:8px;
  background:rgba(0,0,0,.25); padding:10px 12px;
  border-radius:12px; color:#fff; text-decoration:none;
  font-size:13px; font-weight:500;
}
.file-att i{ font-size:20px; color:#fff; }

.btime{ font-size:10px; color:var(--muted); margin-top:4px; padding:0 6px; display:flex; align-items:center; gap:5px; }
.btime .check{ color:var(--p1); font-size:11px; }
.btime .check.read{ color:var(--green); }

/* divider */
.divider{ text-align:center; font-size:11px; color:var(--muted); margin:8px 0; position:relative; }
.divider::before,.divider::after{ content:''; position:absolute; top:50%; width:28%; height:1px; background:var(--border); }
.divider::before{left:0} .divider::after{right:0}

/* typing */
.typing{
  display:flex; align-items:center; gap:5px;
  padding:12px 15px; background:var(--s3);
  border:1px solid var(--border);
  border-radius:18px; border-bottom-left-radius:5px;
  align-self:flex-start; margin-bottom:4px;
  animation:fu .2s ease;
}
.typing span{ width:7px; height:7px; background:var(--p1); border-radius:50%; animation:bonce 1.2s infinite; }
.typing span:nth-child(2){ animation-delay:.2s }
.typing span:nth-child(3){ animation-delay:.4s }
@keyframes bonce{ 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

/* expiry hint */
.expiry-hint{
  text-align:center; font-size:10.5px; color:var(--muted);
  padding:6px 12px 2px; display:flex; align-items:center; justify-content:center; gap:5px;
}
.expiry-hint i{ font-size:10px; color:var(--p1); }

/* INPUT */
.input-area{
  padding:10px 12px 14px;
  border-top:1px solid var(--border);
  display:flex; gap:8px;
  background:#0a0a12; flex-shrink:0; align-items:flex-end;
}
.attach-btn{
  width:42px; height:42px; border-radius:50%;
  background:#14142a; border:1px solid rgba(139,92,246,.28);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  flex-shrink:0; transition:all .15s; color:#a78bfa; font-size:16px;
}
.attach-btn:hover{ background:rgba(139,92,246,.18); color:#fff; }
.input-area textarea{
  flex:1; background:#14142a;
  border:1px solid rgba(139,92,246,.28);
  border-radius:18px; color:#fff;
  font-size:14px; padding:11px 16px;
  resize:none; outline:none;
  line-height:1.45; max-height:100px; overflow-y:auto;
  transition:border-color .2s;
  font-family:inherit;
}
.input-area textarea::placeholder{ color:#3a3a55; }
.input-area textarea:focus{ border-color:rgba(139,92,246,.6); }
.send-btn{
  width:42px; height:42px; border-radius:50%;
  background:linear-gradient(135deg,var(--p1),var(--p2));
  border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; transition:all .15s;
  box-shadow:0 4px 14px -4px rgba(139,92,246,.6);
}
.send-btn:hover{ transform:scale(1.08); }
.send-btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; box-shadow:none; }
.send-btn i{ color:#fff; font-size:15px; }

/* preview anexo */
.preview{
  padding:8px 14px;
  background:#0a0a12;
  border-top:1px solid var(--border);
  display:none; align-items:center; gap:10px; font-size:12px; color:#a78bfa;
}
.preview.show{ display:flex; }
.preview img{ width:40px; height:40px; object-fit:cover; border-radius:8px; }
.preview .pname{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.preview .pclose{ background:none; border:none; color:var(--red); cursor:pointer; font-size:16px; }

/* toast */
.toast{
  position:fixed; top:16px; left:50%; transform:translateX(-50%);
  background:var(--s3); border:1px solid var(--border);
  color:#fff; padding:10px 18px; border-radius:12px; font-size:13px;
  z-index:100; opacity:0; transition:opacity .25s;
  box-shadow:0 8px 30px rgba(0,0,0,.5);
}
.toast.show{ opacity:1; }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <button class="back-btn" onclick="history.back()"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="bot-av"><i class="fa-solid fa-headset" style="color:#fff;font-size:18px"></i><span class="dot"></span></div>
    <div class="h-info">
      <div class="h-name">Suporte Invest Pro</div>
      <div class="h-status"><i class="fa-solid fa-circle" style="font-size:7px"></i> Admin online</div>
    </div>
  </div>

  <div class="topics">
    <button class="chip" onclick="qt('Como investir na plataforma?')">💰 Investir</button>
    <button class="chip" onclick="qt('Esqueci a minha senha')">🔑 Senha</button>
    <button class="chip" onclick="qt('Não recebi os meus valores diários')">⏳ Valores diários</button>
    <button class="chip" onclick="qt('Como funciona o sistema VIP?')">⭐ VIPs</button>
    <button class="chip" onclick="qt('Como depositar saldo?')">📥 Depositar</button>
    <button class="chip" onclick="qt('Como levantar saldo?')">📤 Levantar</button>
    <button class="chip" onclick="qt('Conta bloqueada')">🔒 Acesso</button>
  </div>

  <div class="expiry-hint">
    <i class="fa-regular fa-clock"></i> As mensagens são apagadas automaticamente após 24 horas
  </div>

  <div id="msgs"></div>

  <div class="preview" id="preview">
    <img id="prevImg" src="" alt="">
    <div class="pname" id="prevName"></div>
    <button class="pclose" onclick="clearAttach()"><i class="fa-solid fa-xmark"></i></button>
  </div>

  <div class="input-area">
    <input type="file" id="fileInp" accept="image/*,application/pdf,.doc,.docx" hidden onchange="onFile(event)">
    <button class="attach-btn" onclick="document.getElementById('fileInp').click()" title="Anexar"><i class="fa-solid fa-paperclip"></i></button>
    <textarea id="inp" rows="1" placeholder="Escreva a sua mensagem..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="sbtn" onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i></button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════════
   SUPABASE
════════════════════════════════════ */
const SUPABASE_URL = "https://tuaclpevpkqvoeggywub.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1YWNscGV2cGtxdm9lZ2d5d3ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3Njc2NzEsImV4cCI6MjA5NjM0MzY3MX0.ptGzyNLv0gYyq2DgbXOlBFZgK1VbKdaLAdFwLugom2A";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const TABLE  = "suporte";        // ajuste se o nome real for outro
const BUCKET = "fotos";
const EXPIRY_HOURS = 24;

/* identificação do utilizador — lê o objeto "usuario" gravado pela app */
function getUserId(){
  try {
    const u = JSON.parse(localStorage.getItem('usuario') || '{}');
    if (u && u.id) return u.id;
  } catch(e){}
  return localStorage.getItem('user_id')
      || localStorage.getItem('userId')
      || localStorage.getItem('user_phone')
      || localStorage.getItem('telefone')
      || localStorage.getItem('phone')
      || localStorage.getItem('numero')
      || 'anonimo';
}
const USER_ID = getUserId();

/* ════════════════════════════════════
   STATE
════════════════════════════════════ */
let busy = false;
let attachment = null; // {file, dataUrl}
const seenIds = new Set();

/* ════════════════════════════════════
   UTILS
════════════════════════════════════ */
const $ = id => document.getElementById(id);
const nowT = (d) => new Date(d || Date.now()).toLocaleTimeString('pt-AO',{hour:'2-digit',minute:'2-digit'});
function autoResize(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,100)+'px'; }
function scrollBot(){ const m=$('msgs'); setTimeout(()=>m.scrollTop=m.scrollHeight,60); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function isImg(url){ return /\.(png|jpe?g|gif|webp|bmp)$/i.test(url||''); }

/* ════════════════════════════════════
   RENDER
════════════════════════════════════ */
function renderMsg({id, role, text, file_url, created_at, read}){
  if (id && seenIds.has(id)) return;
  if (id) seenIds.add(id);

  const w = document.createElement('div');
  w.className = `bw ${role}`;
  if (id) w.dataset.id = id;

  const b = document.createElement('div');
  b.className = 'bubble';
  let html = '';
  if (file_url){
    html += isImg(file_url)
      ? `<a href="${file_url}" target="_blank"><img src="${file_url}" alt="anexo"></a>`
      : `<a class="file-att" href="${file_url}" target="_blank"><i class="fa-solid fa-file-lines"></i> Abrir ficheiro</a>`;
  }
  if (text) html += `<div>${escapeHtml(text).replace(/\n/g,'<br>')}</div>`;
  b.innerHTML = html || '<i style="opacity:.5">(vazio)</i>';
  w.appendChild(b);

  const t = document.createElement('div');
  t.className = 'btime';
  t.innerHTML = `${nowT(created_at)} ${role==='user' ? `<i class="fa-solid fa-check-double check ${read?'read':''}"></i>` : ''}`;
  w.appendChild(t);

  $('msgs').appendChild(w);
  scrollBot();
}

function renderDivider(label){
  const d = document.createElement('div');
  d.className = 'divider';
  d.textContent = label;
  $('msgs').appendChild(d);
}

/* ════════════════════════════════════
   LOAD HISTÓRICO (últimas 48h)
════════════════════════════════════ */
async function loadHistory(){
  const since = new Date(Date.now() - EXPIRY_HOURS*3600*1000).toISOString();

  // limpar mensagens do próprio utilizador com mais de 48h
  sb.from(TABLE).delete().eq('usuario_id', USER_ID).lt('criado_em', since).then(()=>{});

  const { data, error } = await sb
    .from(TABLE)
    .select('*')
    .eq('usuario_id', USER_ID)
    .gte('criado_em', since)
    .order('criado_em', { ascending:true });

  if (error){ console.warn(error); return; }

  renderDivider('Hoje');

  if (!data || !data.length){
    renderMsg({ role:'bot', text:'Olá 👋 Bem-vindo ao suporte da **Invest Pro**.\n\nEscreva a sua dúvida ou envie uma foto/ficheiro. A nossa equipa responde aqui mesmo no chat.', created_at:Date.now() });
    return;
  }

  data.forEach(row => {
    // mensagem do utilizador
    if (row.mensagem || row.file_url){
      renderMsg({
        id: 'u_'+row.id,
        role:'user',
        text: row.mensagem,
        file_url: row.file_url,
        created_at: row.criado_em,
        read: !!row.respondido_em
      });
    }
    // resposta do admin
    if (row.resposta){
      renderMsg({
        id: 'a_'+row.id,
        role:'bot',
        text: row.resposta,
        created_at: row.respondido_em || row.criado_em
      });
    }
  });
}

/* ════════════════════════════════════
   REALTIME (respostas do admin)
════════════════════════════════════ */
function subscribe(){
  sb.channel('suporte_'+USER_ID)
    .on('postgres_changes',
      { event:'*', schema:'public', table:TABLE, filter:`usuario_id=eq.${USER_ID}` },
      payload => {
        const row = payload.new || payload.old;
        if (payload.eventType === 'DELETE'){
          document.querySelectorAll(`[data-id="u_${row.id}"], [data-id="a_${row.id}"]`).forEach(el=>el.remove());
          return;
        }
        if (payload.eventType === 'UPDATE' && row.resposta){
          if (!seenIds.has('a_'+row.id)){
            renderMsg({ id:'a_'+row.id, role:'bot', text:row.resposta, created_at:row.respondido_em || Date.now() });
            // marcar tick verde
            const u = document.querySelector(`[data-id="u_${row.id}"] .check`);
            if (u) u.classList.add('read');
          }
        }
      })
    .subscribe();
}

/* ════════════════════════════════════
   ANEXOS
════════════════════════════════════ */
function onFile(e){
  const f = e.target.files[0];
  if (!f) return;
  if (f.size > 10*1024*1024){ toast('Ficheiro máximo: 10 MB'); return; }
  attachment = { file:f };
  const p = $('preview');
  const img = $('prevImg');
  if (f.type.startsWith('image/')){
    const r = new FileReader();
    r.onload = ev => { img.src = ev.target.result; img.style.display='block'; };
    r.readAsDataURL(f);
  } else {
    img.style.display='none';
  }
  $('prevName').textContent = f.name;
  p.classList.add('show');
}

function clearAttach(){
  attachment = null;
  $('fileInp').value = '';
  $('preview').classList.remove('show');
}

async function uploadFile(file){
  const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
  const path = `${USER_ID}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, file, { contentType:file.type, upsert:false });
  if (error) throw error;
  const { data } = sb.storage.from(BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

/* ════════════════════════════════════
   ENVIO
════════════════════════════════════ */
function handleKey(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMsg(); } }
function qt(t){ if(busy) return; $('inp').value = t; sendMsg(); }

async function sendMsg(){
  if (busy) return;
  const inp = $('inp');
  const text = inp.value.trim();
  if (!text && !attachment) return;

  busy = true; $('sbtn').disabled = true;

  let file_url = null;
  try{
    if (attachment){
      file_url = await uploadFile(attachment.file);
    }
  } catch(err){
    toast('Não foi possível enviar o anexo');
    busy = false; $('sbtn').disabled = false;
    return;
  }

  // render imediato (otimista)
  renderMsg({ role:'user', text, file_url, created_at:Date.now() });
  inp.value = ''; inp.style.height = 'auto';
  clearAttach();

  // insert na BD
  const { data, error } = await sb.from(TABLE).insert({
    usuario_id: USER_ID,
    mensagem: text || null,
    file_url: file_url,
    status: 'aberto',
    criado_em: new Date().toISOString()
  }).select().single();

  if (!error && data){
    // marcar este id como já visto, evitar duplicar via realtime
    seenIds.add('u_'+data.id);
    const last = $('msgs').lastElementChild;
    if (last) last.dataset.id = 'u_'+data.id;
  }

  busy = false; $('sbtn').disabled = false;
  inp.focus();
}

/* ════════════════════════════════════
   INIT
════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', async () => {
  await loadHistory();
  subscribe();
});
</script>
</body>
</html>
